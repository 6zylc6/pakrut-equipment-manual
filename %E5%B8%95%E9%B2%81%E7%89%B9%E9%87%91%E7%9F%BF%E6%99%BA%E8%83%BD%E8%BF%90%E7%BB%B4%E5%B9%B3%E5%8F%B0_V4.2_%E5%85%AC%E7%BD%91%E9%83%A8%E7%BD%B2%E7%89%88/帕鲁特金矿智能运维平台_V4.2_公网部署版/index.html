<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>帕鲁特金矿 · 设备智能运维平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f4f7f6;color:#333;font-size:14px;}
.header{background:#2c3e50;color:#fff;padding:15px 20px;display:flex;align-items:center;position:sticky;top:0;z-index:100;}
.menu-btn{font-size:24px;cursor:pointer;margin-right:15px;}
.header h1{font-size:18px;font-weight:normal;flex:1;}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:#34495e;z-index:200;padding-top:60px;transition:left 0.3s;overflow-y:auto;}
.sidebar.open{left:0;}
.main-item{padding:15px 20px;color:#ecf0f1;border-bottom:1px solid #2c3e50;cursor:pointer;}
.main-item.active{background:#1abc9c;color:#fff;}
.mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:150;display:none;}
.mask.show{display:block;}
.content{padding:15px;}
.sub-nav{display:flex;overflow-x:auto;background:#fff;padding:10px;margin-bottom:15px;border-radius:8px;white-space:nowrap;}
.menu-item{padding:8px 15px;margin-right:10px;background:#eee;border-radius:20px;cursor:pointer;font-size:13px;}
.menu-item.active{background:#1abc9c;color:#fff;}
.device-card{background:#fff;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.05);overflow:hidden;}
.device-header{padding:15px;font-weight:bold;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.device-body{display:none;padding:0 15px 15px;border-top:1px solid #eee;}
.device-body.open{display:block;}
.param-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13px;}
.param-table th,.param-table td{border:1px solid #ddd;padding:8px;text-align:left;}
.param-table th{background:#f9f9f9;width:35%;}
.block-title{background:#2c3e50;color:#fff;padding:10px;border-radius:5px;margin:12px 0 8px 0;font-weight:bold;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.block-content{display:none;margin-bottom:8px;}
.block-content.open{display:block;}
.fault-item{background:#fdf2e9;padding:10px;border-left:4px solid #e67e22;margin-bottom:8px;border-radius:4px;line-height:1.6;}
.predict-item{background:#eef6fb;padding:10px;border-left:4px solid #2980b9;margin-bottom:8px;border-radius:4px;line-height:1.6;}
.principle-box{background:#f7fff8;padding:10px;border:1px solid #c8e6c9;border-radius:6px;margin:10px 0;line-height:1.7;}
.search-box,.ai-box{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.05);}
.search-input-area,.ai-input-area{display:flex;margin-top:10px;}
input[type="text"]{flex:1;padding:10px;border:1px solid #ccc;border-radius:5px 0 0 5px;outline:none;}
button{flex:0 0 80px;background:#1abc9c;color:#fff;border:none;padding:10px;border-radius:0 5px 5px 0;cursor:pointer;font-size:14px;}
.search-result,.ai-result{margin-top:10px;white-space:pre-wrap;color:#555;font-size:13px;line-height:1.6;max-height:500px;overflow-y:auto;}
.breadcrumb{padding:10px 15px;color:#666;font-size:13px;}
pre.formula{background:#f0f4f8;padding:6px;border-radius:4px;margin:4px 0;overflow-x:auto;font-family:monospace;}

.spare-intro,.electric-warning{background:#fff7e6;border:1px solid #f2d28b;border-left:5px solid #d69e2e;padding:12px 14px;border-radius:7px;margin:8px 0 14px;line-height:1.65;font-size:13px;color:#4b4435;}
.spare-intro p{margin:5px 0;}
.parts-table-wrap{overflow-x:auto;background:#fff;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.05);}
.parts-table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px;line-height:1.55;}
.parts-table th,.parts-table td{border:1px solid #e2e5e9;padding:10px;vertical-align:top;text-align:left;}
.parts-table th{background:#263b50;color:#fff;position:sticky;top:0;}
.parts-table td:first-child{min-width:150px;}
.parts-table td:nth-child(2){min-width:240px;}
.parts-table td:nth-child(4){min-width:290px;}
.parts-table small{display:inline-block;color:#667085;margin-top:5px;line-height:1.5;}
.priority{display:inline-block;padding:4px 7px;border-radius:4px;background:#eef2f6;color:#344054;font-weight:600;}
.source-list{font-size:12px;color:#667085;padding:10px 2px;line-height:1.7;}
.source-list a{color:#1675a9;text-decoration:underline;margin:0 4px;}
.electric-warning{background:#fff1f0;border-color:#ffccc7;border-left-color:#cf4a3d;color:#5b3030;}
@media(max-width:700px){.parts-table{min-width:850px;}.content{padding:10px;}.main-item{padding:12px 14px;font-size:14px;}}


/* ===== 库存配件明细 / 多人协同 ===== */
.inventory-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 14px;}
.inventory-toolbar input,.inventory-toolbar select,.inventory-form input,.inventory-form select,.inventory-form textarea{padding:9px 10px;border:1px solid #cfd6de;border-radius:6px;background:#fff;min-width:0;font:inherit;color:#263238;}
.inventory-toolbar input{flex:1;min-width:220px;}
.inventory-toolbar select{min-width:150px;}
.inventory-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 14px;}
.inventory-stat{background:#fff;border:1px solid #e3e8ee;border-radius:8px;padding:12px;}
.inventory-stat b{display:block;font-size:20px;color:#20374c;margin-top:4px;}
.inventory-stat span{font-size:12px;color:#667085;}
.inventory-equipment{background:#fff;border:1px solid #e1e6ec;border-radius:9px;margin:12px 0;overflow:hidden;}
.inventory-equipment-head{background:#f3f6f8;padding:12px 14px;border-bottom:1px solid #e1e6ec;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.inventory-equipment-head strong{font-size:15px;}
.inventory-equipment-head small{color:#667085;line-height:1.5;}
.inventory-part-table{width:100%;border-collapse:collapse;font-size:13px;}
.inventory-part-table th,.inventory-part-table td{padding:9px 10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top;}
.inventory-part-table th{background:#fafbfc;color:#475467;white-space:nowrap;}
.inventory-record{display:block;margin:3px 0;padding:5px 7px;border-radius:5px;background:#f5f8fa;line-height:1.5;}
.stock-status{display:inline-block;padding:3px 7px;border-radius:4px;font-size:12px;background:#eef2f6;color:#475467;white-space:nowrap;}
.stock-status.low{background:#fff0e6;color:#a64b00;}
.stock-status.unknown{background:#fff7e6;color:#8a5b00;}
.stock-status.ok{background:#eaf7ef;color:#217448;}
.sync-banner{border:1px solid #cbd5df;background:#f7fafc;border-radius:8px;padding:11px 13px;margin:8px 0 14px;line-height:1.6;}
.sync-banner.online{background:#eef8f1;border-color:#b7dec2;}
.sync-banner.offline{background:#fff7e6;border-color:#f2d28b;}
.inventory-form{background:#fff;border:1px solid #e1e6ec;border-radius:9px;padding:14px;margin:12px 0;}
.inventory-form h3{font-size:16px;margin-bottom:10px;color:#263b50;}
.inventory-form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.inventory-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.inventory-field label{font-size:12px;color:#475467;font-weight:600;}
.inventory-field input,.inventory-field select{width:100%;}
.inventory-field.full{grid-column:1/-1;}
.inventory-field textarea{width:100%;min-height:64px;resize:vertical;}
.inventory-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.inventory-actions button{flex:0 0 auto;border-radius:6px;padding:10px 14px;min-width:120px;}
.inventory-actions button.secondary{background:#526579;}
.inventory-actions button.light{background:#edf2f6;color:#25384a;border:1px solid #d6dee6;}
.inventory-upload-note{font-size:12px;color:#667085;line-height:1.65;margin:8px 0;}
.inventory-ledger{overflow-x:auto;background:#fff;border:1px solid #e1e6ec;border-radius:8px;margin-top:12px;}
.inventory-ledger table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px;}
.inventory-ledger th,.inventory-ledger td{padding:8px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top;}
.inventory-ledger th{background:#f5f7f9;}
.inventory-message{margin-top:10px;padding:9px 11px;border-radius:6px;background:#f1f5f9;color:#334155;line-height:1.55;white-space:pre-wrap;}
.inventory-message.error{background:#fff1f0;color:#9b2c2c;}
.inventory-message.success{background:#eef8f1;color:#217448;}
@media(max-width:760px){.inventory-summary{grid-template-columns:repeat(2,minmax(0,1fr));}.inventory-form-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.inventory-part-table{min-width:760px;}}
@media(max-width:480px){.inventory-form-grid{grid-template-columns:1fr;}.inventory-field.full{grid-column:auto;}.inventory-stat b{font-size:18px;}}


/* ===== V4 现代化运维工作台视觉层 ===== */
:root{--navy:#14283f;--navy2:#1e3854;--teal:#0d9488;--teal2:#0f766e;--ink:#172b42;--muted:#64748b;--line:#e2e8f0;--canvas:#f3f6fa;--card:#fff;}

.header-title{flex:1}.header-title h1{font-size:17px;font-weight:750;letter-spacing:.2px}.header-title small{display:block;color:#8090a3;font-size:11px;margin-top:3px;}

.menu-item{background:#e8eef4;color:#516276;padding:8px 14px;border-radius:7px;font-weight:600}.menu-item.active{background:#d9f2ed;color:#0f766e;}

.device-card,.search-box,.ai-box,.inventory-form,.inventory-equipment,.parts-table-wrap{border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(25,45,68,.045);}
.device-header{padding:17px 18px;color:#20364d}.device-header:hover{background:#f8fbfd}.block-title{background:#edf3f7;color:#29445d;border:1px solid #e3ebf1;border-left:3px solid var(--teal);}
.principle-box{background:#f0faf8;border-color:#ccebe4}.fault-item{background:#fff8f4;border-left-color:#e58b4b}.predict-item{background:#f1f7fd;border-left-color:#4f8dbd;}
.search-box,.ai-box{padding:18px}.search-input-area input,.ai-input-area input{border:1px solid #d8e1e9;border-radius:8px 0 0 8px;}
button{background:var(--teal);border-radius:0 8px 8px 0;font-weight:650}button:hover{background:var(--teal2)}
.inventory-stat{border-radius:11px;padding:15px;border-color:#e5ebf1}.inventory-stat b{color:#18334d}.inventory-form{padding:18px}.inventory-form h3{color:#203d56}.sync-banner{border-radius:10px}
.parts-table th{background:#203a54}.parts-table td,.inventory-ledger td{line-height:1.65}
.home-hero{background:linear-gradient(115deg,#17334f,#20556a 65%,#0f766e);border-radius:16px;padding:26px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden;position:relative;margin-bottom:18px;}
.home-hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff22;border-radius:50%;right:6%;top:-130px;box-shadow:0 0 0 28px #ffffff08,0 0 0 58px #ffffff06;}
.home-hero h2{font-size:23px;margin-bottom:8px}.home-hero p{color:#d5e5ec;line-height:1.7;max-width:700px}.hero-tag{font-size:11px;color:#d5f5ec;background:#ffffff19;border:1px solid #ffffff33;border-radius:20px;padding:7px 11px;white-space:nowrap;z-index:1}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:14px 0 20px}.home-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.home-stat span{color:#718096;font-size:12px}.home-stat b{display:block;font-size:27px;color:#1d3a55;margin:7px 0 2px}.home-stat small{color:#96a2b0;font-size:11px}
.home-section-title{font-size:15px;font-weight:750;color:#29435b;margin:22px 0 12px}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.18s}.quick-card:hover{transform:translateY(-2px);border-color:#9bd6ca;box-shadow:0 8px 20px #1c4b5d12}.quick-card strong{display:block;margin:8px 0 5px;color:#213c56}.quick-card p{font-size:12px;line-height:1.6;color:#718096}.quick-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#e8f6f3;color:#0f766e;font-size:18px}

lay:block;font-size:11px;color:#637487;margin-bottom:5px}.ai-settings input{width:100%;padding:10px;border:1px solid #d8e1e9;border-radius:8px;font:inherit}.settings-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.settings-status{font-size:11px;color:#748396;margin-top:7px}
@media(max-width:1000px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ai-shell{grid-template-columns:1fr}.ai-side{order:2}}
@media(max-width:760px){.header{height:60px;padding:0 14px}.menu-btn{display:block}.header-title h1{font-size:14px}.header-title small{display:none}.header-right{gap:0}.header-right #headerClock{display:none}.sidebar{top:60px;height:calc(100% - 60px);transform:translateX(-105%);left:0;width:255px;z-index:220}.sidebar.open{transform:translateX(0)}.breadcrumb{margin-left:0;padding:13px 14px 0}.sub-nav{margin:9px 14px 0;padding:6px;}.content{margin-left:0;padding:12px 14px 30px}.home-hero{padding:20px;align-items:flex-start;flex-direction:column}.home-hero h2{font-size:19px}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.home-grid{gap:9px}.home-stat{padding:13px}.home-stat b{font-size:23px}.ai-chat-log{min-height:280px;padding:12px}.ai-bubble{max-width:96%}.ai-settings-grid{grid-template-columns:1fr}}

<body>
<div class="header">
  <div class="menu-btn" onclick="toggleSide()">☰</div>
  <div class="brand-mark">P</div>
  <div class="header-title"><h1>帕鲁特金矿 · 智能运维平台</h1><small>设备档案 / 备件库存 / 维修知识 / AI 助手</small></div>
  <div class="header-right"><span class="local-pill"><i></i> 云端共享运行</span><span id="headerClock"></span><form class="logout-form" action="/logout" method="post"><button type="submit">退出登录</button></form></div>
</div>
<div class="mask" id="mask" onclick="closeSide()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-caption">工作台</div>
  <div class="main-item active" data-fac="home">⌂　首页总览</div>
  <div class="main-item" data-fac="ai">✦　AI 助手</div>
  <div class="sidebar-caption">设备与知识</div>
  <div class="main-item" data-fac="xuan">▦　选矿厂设备</div>
  <div class="main-item" data-fac="cai">▦　采矿厂设备</div>
  <div class="main-item" data-fac="parts">⚙　常用配件目录</div>
  <div class="main-item" data-fac="electric">ϟ　电气知识与规程</div>
  <div class="sidebar-caption">仓储管理</div>
  <div class="main-item" data-fac="stockUpload">▤　库存与出入库</div>
</div>
<div class="breadcrumb" id="breadcrumb"></div>
<div class="sub-nav" id="sub-nav"></div>

<script>

障；滚筒/托辊卡死。","action":"查明保护动作点；检查开关及线路；排除卡阻后复位，严禁短接保护装置。"}],"predictive":[{"item":"巡检皮带跑偏、接头、裂纹、张紧及托辊转动状态。"},{"item":"记录驱动电机电流、减速机温度/振动、带速和输送量。"},{"item":"定期测试拉绳、跑偏、打滑和堵料保护，检查清扫器及滚筒包胶。"}]},{"name":"除尘器","params":{"一级分类":"破碎专用设备","二级分类":"06.充填破碎站","规格型号":"WQM64-5","技术参数":"处理风量＞20000m³/h, 过滤面积310㎡, 滤袋总数320,除尘器室数5个, 功率55kW, 漏风率≤3%,全自动电脑控制","制造商":"江苏维尔思","使用部门":"充填破碎站","存放地点":"充填破碎站","资产状态":"在用","资产来源":"购置","备注":""},"principle":{"formula":"过滤风速 v=Q/(60A)；设备阻力由滤袋阻力、粉尘层阻力和管路阻力共同构成。","desc":"含尘气体通过滤袋，粉尘被截留在滤料表面，净气排出；脉冲清灰系统周期性剥离滤袋积灰。台账记载处理风量＞20000m³/h、过滤面积310㎡、320条滤袋、5个室、功率55kW。"},"faults":[{"phenom":"除尘效果差、排气口冒灰","cause":"滤袋破损/脱落；花板密封失效；检修门漏风；清灰过强造成滤袋损伤。","action":"按安全规程停机隔离后检查滤袋和密封；更换破袋；检查花板、检修门和安装质量。"},{"phenom":"系统压差持续偏高、风量下降","cause":"滤袋糊袋；清灰系统故障；粉尘湿度高；灰斗积灰堵塞；管路堵塞。","action":"检查压差取压管和仪表；检查脉冲阀、气源及喷吹管；清理灰斗和管道，查明糊袋原因。"},{"phenom":"压差过低但排放浓度升高","cause":"滤袋破损或旁路漏风；压差仪表失准；滤袋安装不严。","action":"检查滤袋、花板和密封；校验压差及排放监测仪表。"},{"phenom":"脉冲清灰不动作、压缩空气消耗异常","cause":"供气压力不足；电磁阀/膜片阀故障；控制器参数或线路异常；气管泄漏。","action":"检查气源压力、储气罐排水和阀组；逐路测试电磁阀；修复漏气并校验控制程序。"}],"predictive":[{"item":"连续记录进出口压差、风机电流、排气粉尘及清灰气源压力。"},{"item":"按周期检查滤袋破损、糊袋、袋笼腐蚀、花板密封和灰斗积灰。"},{"item":"检查脉冲阀动作次数、喷吹压力、风管漏风及风机轴承温度/振动。"}]},{"name":"圆盘给料机","params":{"一级分类":"破碎专用设备","二级分类":"06.充填破碎站","规格型号":"LYPDX25","技术参数":"50-100 m³/h, 连续工作12h, 粒径≤16mm","制造商":"广州磊蒙机械","使用部门":"充填破碎站","存放地点":"充填破碎站","资产状态":"在用","资产来源":"购置","备注":"减速机润滑系统应定期换油，一般初次使用一周，换油一次。以后每4-5 个月换油一次。稀油润滑站及圆盘给料机内油池每45个月换油一次 ，设备组装后注油量各 60kg.。回转支承在设备组装后注油量 25kg ，补油间隔1年，补油量1kg"},"principle":{"formula":"给料量 Q≈3600·Vrev·n·ρ·φ；Vrev为每转有效排料体积，n为转速，ρ为堆密度，φ为充填系数。","desc":"驱动装置带动圆盘旋转，物料在刮料/导料结构作用下连续定量排出。台账记载能力50–100m³/h、连续工作12h、物料粒径≤16mm；润滑换油和补油要求以台账备注及厂家说明书为准，备注中的“每45个月”建议现场核对原始记录。"},"faults":[{"phenom":"给料量不稳定或出料量偏小","cause":"料仓下料不畅；圆盘/刮料器间隙异常；物料潮湿结块；转速波动；减速机故障。","action":"检查料仓架桥和物料结块；清理出料口；检查刮料器间隙、传动及变频/电机转速。"},{"phenom":"圆盘转动卡涩、异响或振动","cause":"盘面与壳体摩擦；轴承损坏；紧固件松动；异物进入；安装基础不平。","action":"停机断电清除异物；检查盘面间隙、轴承和基础；紧固连接件后手动盘车确认无干涉。"},{"phenom":"减速机温升高、漏油或噪声大","cause":"油位不当或油品污染；润滑周期不符合要求；轴承/齿 "库存现状":"待现场盘点（本台账不代表仓库已有库存）","搜索关键词":"电机 轴承 接触器 熔断器 变频器 PLC 传感器 24V电源 MCC"},"principle":{"formula":"备件再订货点 ROP = 平均月耗用量 × 采购交期（月） + 安全库存；安全库存按故障影响、耗用波动、供应周期和修复能力确定。","desc":"本条为按设备机理与制造商公开备件范围形成的建议清单，不是该设备的正式BOM，也不是采购型号确认单。最终料号、材质、尺寸、数量、安装版本及左右件必须以铭牌、总装图、零件图和厂家确认的序列号/版本为准。"},"faults":[],"predictive":[{"item":"建立设备位号—制造商—型号—原厂图号—仓库编码—库存数量—采购交期对应关系。"},{"item":"先做电气元件台账和关键备件矩阵；关键设备的驱动器/PLC模块按停机后果、兼容版本、供货周期配置；易受潮/静电敏感模块按ESD要求储存。"}],"sources":[{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"}]}]}}},"electric":{"title":"电气知识与操作规程","cats":{"motor":{"title":"电机与功率速算","devices":[{"name":"三相电机功率、电流与负载快速估算","params":{"适用范围":"破碎机、球磨机、渣浆泵、空压机、风机、起重机等三相交流电机","检索词":"三相功率 电流算功率 kW cosφ 功率因数 负载率 额定电流","技术依据/来源":"IEEE Std 43标准信息"},"principle":{"formula":"三相输入有功功率 P₁(kW)=√3×U_LL(V)×I_L(A)×cosφ/1000；估算轴输出功率 P₂≈P₁×η。反算额定负载电流 I≈1000×P₂/(√3×U_LL×cosφ×η)。视在功率 S(kVA)=√3×U_LL(V)×I(A)/1000。","desc":"U_LL为线电压，I_L为线电流，cosφ为功率因数，η为效率（均应取铭牌/实测或厂家数据）。例：只知道电流不能唯一算出kW，必须知道电压、功率因数；算电机轴输出还要乘效率。铭牌“400kW”通常是额定轴输出功率，不能把公式算出的输入功率直接与400kW比较。轻载、变频和谐波场景应使用合适的功率分析仪，不要用钳表电流简单判定真实负载。"},"faults":[{"phenom":"电机电流偏高但负载看似正常","cause":"电压偏低/三相不平衡；机械负载增大或轴承/泵体卡涩；功率因数或谐波变化；变频参数或电机接线错误。","action":"记录三相电压、电流、功率、功率因数和频率；与铭牌额定值及历史基线比较；同时检查机械负载和保护记录，由电气人员测量。"},{"phenom":"三相电流明显不平衡","cause":"电源电压不平衡；熔断器/接触器触点接触不良；电缆端子松动；绕组局部短路/接线问题。","action":"停机并执行停送电程序；检查三相电压和回路连接；由合格电工做绕组电阻、绝缘和必要的电机诊断，禁止带电紧固端子。"}],"predictive":[{"item":"每台电机记录铭牌kW、额定电压、电流、功率因数、效率、接法、绝缘等级和轴承型号。"},{"item":"趋势记录空载/负载电流、功率、温升、振动和启动时间，结合工艺负荷分析。"}],"sources":[{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"}]},{"name":"电机电流快速估算与“经验系数”边界","params":{"适用范围":"现场粗估三相低压电机电流；不能代替铭牌、测量或保护整定","检索词":"每千瓦多少安 2A经验公式 400V 10kV 三相电机","技术依据/来源":"IEEE Std 43标准信息"},"principle":{"formula":"三相电机额定电流近似 I(A)=1000×P₂(kW)/(√3×U(V)×cosφ×η)。对于400V电机，经验上每kW电流约为 1.8–2.0A 只适合一般功率因数/效率范围的粗略心算；大功率、10kV电机、不同极数/效率/变频工况必须按铭牌或公式计算。","desc":"“每kW约2A”只是一种低压三相电机的心算近似，不是保护整定值，也不能跨电压使用。举例：若电机额定输出400kW、10kV，假设cosφ=0.88、η=0.95，则估算额定电流约27.9A；实际必须以铭牌为准。电流与负载并非严格线性，空载励磁电流占比明显；启动电流、堵转电流和变频器输入电流另当别论。"},"faults":[{"phenom":"用经验系数估出的电流与实测差很多","cause":"电机电压等级不同；cosφ、效率、极数或负载不同；测量位置在变频器输入/输出侧；电流表波形适应性不足。","action":"回到铭牌和三相公式；核对测量点、线电压、频率、负载率和仪表类型；必要时用功率分析仪。"},{"phenom":"以“电流低”误判电机能力不足","cause":"电机处于轻载；机械联轴器/皮带传动失效；相电压错误；变频频率低于额定频率。","action":"结合转速、工艺流量/产量、输出功率及设备机械状态判断；不要单靠电流决定更换电机。"}],"predictive":[{"item":"把400V、690V、6kV、10kV电机分别维护各自铭牌基线。"},{"item":"钳形表测量应分别记录三相，变频器PWM输出必须用适配测量仪器。"}],"sources":[{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"}]},{"name":"电机启动、过载与保护动作快速排查","params":{"适用范围":"破碎机、磨机、泵、风机、空压机和起重机构电机回路","检索词":"电机过载 缺相 堵转 跳闸 热继 变频器报警 启动失败","技术依据/来源":"OSHA能量隔离/上锁挂牌参考"},"principle":{"formula":"过载判断应比较实测电流与电机铭牌额定电流、服务系数/工作制及保护整定；热模型受电机热容量、启动时间、环境温度和启动频次影响。电机起动压降可观察启动电流/电压趋势，但不使用单一通用“启动电流倍数”决定合格与否。","desc":"先读故障继电器/变频器事件记录，再区分短路、过载、缺相、堵转、接地故障、欠压、过温和保护误动作。破碎机/球磨机、泵、风机常见机械侧负载变化很大，必须同时检查机械转动和工艺堵塞。"},"faults":[{"phenom":"启动瞬间跳闸","cause":"机械卡阻或带负荷启动；启动电压下降；电机接线/星三角切换错误；保护曲线与启动时间不协调。","action":"隔离电源后手动检查机械转动；核对启动方式、接线和电压；读取保护记录；由授权电工核对保护整定与设计文件，不得随意放大整定。"},{"phenom":"运行一段时间后热继/电子保护跳闸","cause":"持续过载；冷却风道堵塞；频繁启停；轴承阻力；缺相或三相不平衡；环境温度过高。","action":"核对负载与铭牌、三相电流、电压和绕组/轴承温度；清理冷却；检查机械负载和启停频次；查因后复位。"},{"phenom":"保护动作后反复复位仍跳闸","cause":"故障原因未排除；电缆/绕组短路或对地；机械卡涩；控制回路或传感器故障。","action":"停止反复试送电；隔离、验电并按电气事故处理程序排查；必要时测绝缘、绕组电阻和电缆，不得反复强送。"}],"predictive":[{"item":"保存过载继电器/变频器故障代码和动作时间。"},{"item":"定期测电机三相电流不平衡、轴承温度、振动和冷却通道。"}],"sources":[{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"}]}]},"insulation":{"title":"绝缘测试与电机判定","devices":[{"name":"电机绝缘电阻：如何正确测量","params":{"适用范围":"低压与高压交流/直流旋转电机绕组；HP500 10kV电机等高压设备仅由授权高压试验人员操作","检索词":"绝缘电阻 兆欧表 摇表 IR PI 极化指数 DAR 10分钟 1分钟 受潮 电机烧坏","技术依据/来源":"IEC 60034-27-4:2018；IEEE Std 43标准信息；Megger极化指数参考；OSHA能量隔离/上锁挂牌参考"},"principle":{"formula":"绝缘电阻 IR=试验电压下测得的直流电压/泄漏电流（仪表直接显示MΩ/GΩ）；极化指数 PI=R₁₀min/R₁min；介质吸收比 DAR=R₆₀s/R₃₀s。测试电压必须按电机额定电压、绕组绝缘和厂家/标准选取，不能用一个测试电压覆盖所有电机。","desc":"流程要点：①停机、断电、隔离所有电源并上锁挂牌；②确认电机与变频器、电缆、加热器、浪涌保护器及电子传感器隔离，避免损坏仪器/设备并避免它们影响读数；③验明无电，清洁接线端子；④按适用标准选择试验电压和时间；⑤测绕组对地及必要的相间绝缘；⑥测试结束充分放电并验证端子电压为零后才能接线。环境温湿度、绕组温度、测试时间及仪器型号必须记录。"},"faults":[{"phenom":"绝缘阻值较上次突然下降","cause":"绕组受潮、粉尘/油污/盐分污染；电缆或接线盒泄漏；绕组温度差异；未隔离外接设备；测试线/仪表问题。","action":"停止送电计划；核对测试接线与仪器、温度和隔离范围；清洁干燥后按同一方法复测并做趋势对比；高压电机交由合格试验人员进一步诊断。"},{"phenom":"绝缘读数跳动、不稳定","cause":"端子表面污染/潮湿；接地和屏蔽连接错误；试验线接触不良；电机未充分放电；接有变频器/电子器件。","action":"先核实安全隔离和仪器状态；清洁干燥测试点、改善连接；断开不应参与测试的设备；重复测试并记录稳定读数。"},{"phenom":"绝缘测试后无法判断是否可继续使用","cause":"只测了一次且没有温度修正/历史趋势；将PI或兆欧数套用错误标准；局部弱点未被整体IR试验发现。","action":"不得仅凭一次IR值判废或判合格；按IEC/IEEE及厂家适用条款进行温度修正、历史趋势比较，并结合绕组电阻、介损/局放/耐压等必要诊断，由专业负责人签发结论。"}],"predictive":[{"item":"每台关键电机建立投运/检修/雨季/长期停机前后的绝缘趋势档案。"},{"item":"测试报告记录绕组温度、环境湿度、试验电压、测量时间、IR1min、IR10min、PI、DAR和仪器编号。"},{"item":"测完必须放电，完成验电确认后再接回电缆；严禁对仍连接变频器或电子控制模块的回路直接摇测。"}],"sources":[{"name":"IEC 60034-27-4:2018","url":"https://webstore.iec.ch/en/publication/31645"},{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"},{"name":"Megger极化指数参考","url":"https://www.megger.com/en-us/PIpredictor"},{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"}]},{"name":"绝缘电阻参考判据：怎么快速筛查，不凭单个数值判废","params":{"适用范围":"电机绕组绝缘趋势监测；特别注意高压电机和不同绝缘系统","检索词":"5兆欧 100兆欧 kV加1 PI小于2 电机报废 判废 40度","技术依据/来源":"IEC 60034-27-4:2018；IEEE Std 43标准信息；Megger极化指数参考；AEMC绝缘测试培训资料（含IEEE 43-2013参考表）"},"principle":{"formula":"IEEE 43-2013培训资料所列40°C参考下限（需先确认绕组类型/年代及适用条款）：随机绕组定子、以及额定电压低于1kV的成型绕组常见参考值为5MΩ；约1970年后多数成型绕组AC电机常见参考值100MΩ；约1970年前多数绕组、励磁绕组等参考为额定线电压(kV)+1 MΩ。PI=R10min/R1min。","desc":"以上不是跨所有电机的报废标准，更不是塔吉克斯坦现场法规。IEC 60034-27-4:2018强调按绕组类型（热固性/热塑性等）、试验条件及趋势解释，标准适用于额定功率750W及以上的旋转电机。测试读数要换算/修正到标准参考温度并按适用版本核验；绝缘电阻/PI不能定位绕组局部弱点，也不能预测剩余寿命。现代某些绝缘系统PI可能不敏感；AEMC培训资料还提示，当测试开始1min时IR已高于5GΩ，PI比值可能不适用/缺乏区分意义，须按制造商和适用标准规定。对HP500 10kV电机，不能仅凭“kV+1”一条经验式定报废。"},"faults":[{"phenom":"IR低于参考值或PI偏低","cause":"受潮/污染、温度未修正、绕组绝缘老化、外接电缆或元件未隔离、绕组内部缺陷。","action":"标记为“不宜直接送电，需复核/诊断”，不直接宣布报废；检查接线、清洁、干燥、温度修正和重复测试；由高压试验负责人结合制造商限值决定。"},{"phenom":"绝缘阻值很高但运行仍跳接地/烧毁","cause":"绝缘测试未覆盖电缆/接头弱点；电机内部局部放电/匝间短路；潮湿振动引起间歇故障；测试电压不足以发现某些缺陷。","action":"检查电缆、端子盒和接地故障记录；需要时开展绕组电阻、匝间/冲击比较、局放等适用诊断；不能以高IR值保证没有局部绝缘缺陷。"},{"phenom":"绕组对地绝缘接近0MΩ、相间差异显著或接地保护持续动作","cause":"可能存在绕组/引线对地击穿、受潮污染、端子盒爬电，或测量时外接电缆/元件未正确隔离；也需排除仪器和接线错误。","action":"立即禁止送电并隔离故障电机；分开测试电机本体和电缆、检查接线盒/端子与表面污染；由合格试验人员复核。若确认绕组绝缘击穿或不满足适用标准，应修理/重绕或报废评估，修复后重新按标准试验并记录。"}],"predictive":[{"item":"对关键电机做定期同条件对比，重点关注持续下降趋势和复测重复性。"},{"item":"使用标准/制造商规定的温度修正方法，不把“每升高10℃电阻减半”当作适用于所有绝缘系统的通用精确换算。"}],"sources":[{"name":"IEC 60034-27-4:2018","url":"https://webstore.iec.ch/en/publication/31645"},{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"},{"name":"Megger极化指数参考","url":"https://www.megger.com/en-us/PIpredictor"},{"name":"AEMC绝缘测试培训资料（含IEEE 43-2013参考表）","url":"https://www.aemc.com/userfiles/files/resources/webinars/PPT.06.0025.v01-Insulation_Testing_Webinar.pdf"}]},{"name":"极化指数 PI 与介质吸收比 DAR 怎么看","params":{"适用范围":"绝缘电阻测试的补充指标","检索词":"PI 极化指数 DAR 1分钟 10分钟 绝缘吸收","技术依据/来源":"IEC 60034-27-4:2018；IEEE Std 43标准信息；Megger极化指数参考；AEMC绝缘测试培训资料（含IEEE 43-2013参考表）"},"principle":{"formula":"PI=R(10min)/R(1min)；DAR=R(60s)/R(30s)。示例：1min=200MΩ、10min=500MΩ，则PI=2.5。","desc":"PI/DAR是吸收过程的比值，不取代绝缘电阻绝对值。参考培训资料常把PI约2及以上作为某些旋转电机绝缘状态可接受的经验筛查，但分类取决于绝缘材料和机器类型；A级绝缘/某些现代绕组可能适用不同判断。若1min绝缘电阻已非常高，PI可能不再具有足够区分能力。必须依据IEC 60034-27-4、IEEE 43适用条款及电机制造商标准。"},"faults":[{"phenom":"PI接近1或读数几乎不随时间上升","cause":"可能受潮/污染、表面泄漏，或绝缘材料本身吸收特性不同；也可能因测试接法、温度、试验时间错误。","action":"先确认设备适用PI判据、测试电压和温度；清洁干燥后复测；与历史数据和IR绝对值综合判断。"},{"phenom":"PI值很高但绝缘电阻绝对值很低","cause":"比值改善不代表绝对电阻达到适用最低值；测试时间或电压选取不当。","action":"同时报告IR1min、IR10min、PI及温度；绝对值不满足适用标准时不得只看PI值判合格。"}],"predictive":[{"item":"记录原始IR时间曲线，不只保留PI最终比值。"},{"item":"对高压绕组试验由具备资质人员执行，测试后放电接地。"}],"sources":[{"name":"IEC 60034-27-4:2018","url":"https://webstore.iec.ch/en/publication/31645"},{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"},{"name":"Megger极化指数参考","url":"https://www.megger.com/en-us/PIpredictor"},{"name":"AEMC绝缘测试培训资料（含IEEE 43-2013参考表）","url":"https://www.aemc.com/userfiles/files/resources/webinars/PPT.06.0025.v01-Insulation_Testing_Webinar.pdf"}]},{"name":"兆欧表选择、接线与测试后放电注意事项","params":{"适用范围":"电机绕组、电力电缆和电气设备绝缘测试；不同对象测试电压不同","检索词":"兆欧表 摇表 试验电压 放电 VFD 变频器 电缆测试","技术依据/来源":"IEC 60034-27-4:2018；IEEE Std 43标准信息；OSHA能量隔离/上锁挂牌参考"},"principle":{"formula":"测试电压不是由“电机功率kW”单独决定；应按设备额定电压、绝缘等级、标准和厂家试验程序选择。测试报告必须注明所用兆欧表的试验电压档位、测试时间和被测回路范围。","desc":"电机绕组试验前需把VFD/软启动器、电缆、温度传感器、加热器、浪涌保护器和控制电子部件按厂家要求隔离；否则既可能造成测量误差，也可能损坏电子元件。高压绕组测试后必须充分放电并采取接地措施，确认残余电荷释放后才能触碰端子。测试前后均应验证验电器功能。"},"faults":[{"phenom":"测试后端子仍有残余电压/电荷","cause":"绕组电容储能；未执行充分放电；测试对象较大或长电缆。","action":"禁止直接触摸；使用额定合适的放电/接地装置按规程释放电荷，并使用合格仪表验证无电；放电时间按测试对象和设备规程确定。"},{"phenom":"对接VFD回路摇测后驱动器损坏","cause":"变频器功率模块、滤波电容、EMC滤波器或传感器未从被测回路隔离。","action":"先确认电缆和电机物理隔离点；遵照变频器制造商说明；分别测试电机和电缆，不对变频器电子输入/输出端直接施加兆欧表电压。"}],"predictive":[{"item":"测试设备定期校验；使用匹配电压等级的绝缘手套、护目及屏障等防护用品。"},{"item":"测量后完成放电、验电和复接检查，并保存测试记录。"}],"sources":[{"name":"IEC 60034-27-4:2018","url":"https://webstore.iec.ch/en/publication/31645"},{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"},{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"}]}]},"ground":{"title":"接地、漏电与电气保护","devices":[{"name":"保护接地 PE、等电位连接与接地电阻测试","params":{"适用范围":"所有电机外壳、MCC柜体、设备钢结构、变压器/配电系统和矿区接地网","检索词":"接地 接地电阻 PE保护接地 等电位 接地网 接地棒 漏电保护","技术依据/来源":"Fluke接地测试方法"},"principle":{"formula":"三点法/电位降法测接地电阻：用辅助电流极注入测试电流，用电位极测电位差，R=V/I。接地导体连续性/保护回路阻抗与接地极电阻是不同测试项目，不应混为一谈。","desc":"接地系统至少要分别验证：设备外露可导电部分与PE/接地网连接连续可靠；接地极系统电阻符合本矿供电设计与当地适用标准；保护装置能在规定时间内切断故障电流。三点法适用于可布置辅助极的接地极测试；钳形接地电阻法只有在存在多重并联接地回路/闭合回路时才适用，不能把钳形表夹在孤立的一根接地棒上就当作有效测量。Fluke资料解释了电位降法及钳形法适用边界。"},"faults":[{"phenom":"设备外壳带电感或接地连续性差","cause":"PE线断股/松脱；接地端子锈蚀；软连接损坏；多点连接错误；维护后未恢复接地。","action":"立即停止设备并隔离电源；检查PE导体、端子、跨接线和等电位连接；使用低电阻连续性测试仪按规程验证，恢复并复验前不得送电。"},{"phenom":"接地电阻测试读数不稳定或偏高","cause":"辅助极布置不正确；电极接触不良；土壤干湿/冻土差异；并联接地路径影响；测试线耦合。","action":"按仪器说明布置三点法电流极/电位极，移动电位极重复验证曲线稳定；记录天气、土壤与布极距离；复杂地网由专业人员采用适当测试方法。"},{"phenom":"漏电/接地保护频繁动作","cause":"电缆绝缘破损/潮湿；电机绕组受潮；电缆接头污染；VFD共模泄漏/滤波器配置；保护器类型/参数不适配。","action":"先定位故障馈线并隔离，不得短接漏电保护；分别检查电缆、电机和接线盒绝缘；核对VFD制造商对剩余电流保护器类型的要求及保护设计。"}],"predictive":[{"item":"设备检修、改线、移位或接地网扩建后，复测接地连续性和接地系统并归档。"},{"item":"接地测试记录需含测试方法、仪器编号、土壤/天气、测点位置、读数和判定依据。"}],"sources":[{"name":"Fluke接地测试方法","url":"https://www.fluke.com/en-us/learn/blog/grounding/earth-ground-testing"}]},{"name":"漏电保护、短路保护、过载保护各自保护什么","params":{"适用范围":"MCC、配电箱、电机回路、照明和井下电气馈线","检索词":"漏电保护 短路 过载 接地故障 零序 继电保护 CT整定","技术依据/来源":"OSHA能量隔离/上锁挂牌参考；Fluke接地测试方法"},"principle":{"formula":"过载保护主要按电流—时间特性保护导体/电机热效应；短路保护按短路电流和分断能力切除大故障电流；剩余电流/接地故障保护检测不平衡/故障电流。三类保护功能不同，不能互相替代。","desc":"矿区配电保护的额定值、动作曲线、选择性和接地方式必须由供电系统设计与保护整定计算决定。不得用“电机额定电流乘某固定倍数”现场随意设定；不得因频繁跳闸而屏蔽保护。对10kV开关柜、变压器、母线及井下馈电保护，必须由授权高压电气人员执行。"},"faults":[{"phenom":"短路/接地保护动作","cause":"电缆或设备绝缘故障；母线/端子异物；电机绕组接地；雷击/浪涌；接地系统异常。","action":"按保护动作报告隔离故障区段；执行验电、放电、接地和检修许可；检查电缆、电机、开关柜和母线，故障原因确认前不得强送。"},{"phenom":"过载保护反复动作","cause":"机械过载、堵转、启动时间过长、相不平衡、冷却问题或保护整定不匹配。","action":"先查实际电流及机械负载，核对电机铭牌、CT变比和保护参数；整定变更须有批准计算依据。"},{"phenom":"漏电保护无故动作或拒动","cause":"线路对地泄漏；VFD高频泄漏电流；零序CT接线/方向错误；保护器类型不适配；传感器/二次线路故障。","action":"由专业电工按系统接地方式和驱动器厂家说明分段测量；校验零序互感器及保护器，不得旁路或随意更换不同类型保护器。"}],"predictive":[{"item":"定期核对保护装置型号、整定单、CT/PT变比、跳闸回路和试验记录。"},{"item":"每次保护动作保存故障录波/事件和复位前检查记录。"}],"sources":[{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"},{"name":"Fluke接地测试方法","url":"https://www.fluke.com/en-us/learn/blog/grounding/earth-ground-testing"}]},{"name":"矿区电气停送电与上锁挂牌（LOTO）基本流程","params":{"适用范围":"破碎机、磨机、皮带、泵、风机、起重、压滤、空压和井下设备检修","检索词":"停送电 上锁挂牌 LOTO 验电 反送电 VFD直流母线 残余能量 工作票","技术依据/来源":"OSHA能量隔离/上锁挂牌参考；塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）"},"principle":{"formula":"零能量确认应覆盖所有能源：主电源/备用电源、控制电源、VFD直流母线电容、液压蓄能、压缩空气、重力载荷、弹簧张力、旋转惯性及工艺压力。LOTO不是只拉开一个断路器。","desc":"基本顺序：工作许可/风险辨识→识别全部能源与反送电来源→通知受影响岗位→正常停机→断开并隔离能源→个人上锁挂牌→释放/阻挡残余能量（泄压、放电、机械支撑、等待旋转件停止）→使用合格验电器验明无电（验电器先自检、验后再验证）→按高压程序装设接地/短路措施→划定作业区→工作→清点人员工具、恢复护罩和接地措施→由上锁者按规程解锁→授权人员确认后送电试车。此为安全管理模板，须映射现场实际一次系统/联锁/工作票程序。"},"faults":[{"phenom":"检修时设备意外启动/突然转动","cause":"只停止按钮而未隔离主电源；存在备用/联络电源或远程PLC启动；多人作业未使用个人锁；重力/弹簧/气压储能未释放。","action":"立即停止作业并撤离危险区；重新组织风险辨识和能源清单；对每个隔离点使用个人锁和挂牌；测试启动按钮/控制命令无效并验明能量为零。"},{"phenom":"VFD断电后误认为立即无电","cause":"直流母线电容仍储能；备用控制电源/加热回路仍带电；厂家规定放电时间未到。","action":"按具体VFD手册等待规定放电时间，再按程序验电；不凭指示灯熄灭判断无电；不得拆开驱动器直流母线端子。"},{"phenom":"停电影响井下通风、排水或关键联锁","cause":"检修范围/供电回路识别不完整；未获调度/通风/排水负责人批准；未制定备用通风/排水方案。","action":"井下主通风、排水、提升及安全监测供电的切换/停电必须事前履行矿级审批和调度确认；不得擅自停机、切换或复电；确保人员撤离/备用系统按矿山预案执行。"}],"predictive":[{"item":"建立每台关键设备隔离点照片、单线图、能源清单和专用LOTO程序卡。"},{"item":"每次检修实行工作票/操作票、个人锁、试启动验证、交接记录和复电确认。"},{"item":"起重机构吊载、液压缸、球磨机慢驱、弹簧张紧器等必须设置机械支撑或可靠防转措施。"}],"sources":[{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"},{"name":"塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）","url":"https://nazorat.tj/?p=6265"}]},{"name":"井下与选矿厂电气设备作业注意事项","params":{"适用范围":"井下钻机、排水泵、通风机，以及选矿厂10kV/低压配电和移动设备","检索词":"井下电气 矿用防爆 露天矿 井下安全 通风机 排水泵 接地电缆","技术依据/来源":"塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）；OSHA能量隔离/上锁挂牌参考"},"principle":{"formula":"作业边界依据：设备电压等级、矿井供电系统接地方式、危险区域分区、设备防爆/矿用认证及本矿批准的供电设计和操作规程。","desc":"井下与选厂电气操作至少应明确：电气负责人/授权操作人员；停送电联系与调度许可；矿用设备的防爆/矿用标志、接地和电缆管理；开关柜/启动器标识；绝缘防护用具定期试验；电缆悬挂/保护；主通风机、排水泵及提升设备的供电可靠性。网页检索到塔吉克斯坦官方公开的《露天矿安全规则》相关信息，但露天规则不能自动代替井下矿山专门法规。具体适用的地下矿山电气规则、版本和条款必须由矿方法务/安全/机电负责人核验当前有效文本。"},"faults":[{"phenom":"井下设备外壳接地/电缆外皮损坏","cause":"移动电缆拖拽挤压；接地芯线损伤；接线盒密封失效；防爆接合面损坏。","action":"立即停用并按井下电气故障程序隔离；由授权人员检查电缆、接地芯线、接线盒和防爆结构；未经检验/签字不得恢复运行。"},{"phenom":"主通风或主排水设备电源/保护故障","cause":"供电馈线故障、开关柜保护动作、备用电源切换失败或远程控制异常。","action":"立即按矿山应急预案通知调度、通风/排水负责人和机电值班；按批准程序切换备用系统、撤离受影响区域；不得为恢复生产绕过保护。"},{"phenom":"普通摄像头/传感器拟用于井下潜在爆炸危险区","cause":"设备没有对应防爆/矿用认证；供电方式、外壳或接插件不适用；安装位置不满足区域划分。","action":"先进行危险区域分类核验；只有认证范围、气体组别、温度组别和设备保护型式满足现场要求的设备才可安装；普通商用摄像机不能仅凭IP防护等级用于爆炸危险区。"}],"predictive":[{"item":"建立高低压电气作业人员授权清单、操作票/工作票和绝缘防护用品试验台账。"},{"item":"核验适用于现场危险区域的矿用/防爆认证证书、铭牌及防护型式（认证标识以当地适用制度为准，不把某一国家的单一认证标志直接当作当地法定要求）；设备搬迁和维修后复验接地、防爆结构及保护功能。"}],"sources":[{"name":"塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）","url":"https://nazorat.tj/?p=6265"},{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"}]},{"name":"10kV高压电机/开关柜巡视与故障排查边界","params":{"适用范围":"HP500 10kV 400kW电机及矿区高压配电、变压器和馈线","检索词":"10kV 高压电机 HP500 开关柜 五防 差动保护 接地保护","技术依据/来源":"IEC 60034-27-4:2018；IEEE Std 43标准信息；OSHA能量隔离/上锁挂牌参考"},"principle":{"formula":"高压电机巡检重点为三相电流/电压、绕组/轴承温度、振动、绝缘趋势、冷却风路、接线端子、保护继电器动作和局部放电/电晕迹象（按配置）。","desc":"高压系统任何验电、接地、试验、母线或电缆检修必须由具备相应资格的人员按批准的高压操作票执行。这里提供现象识别和记录项目，不提供带电开柜、短接、调保护或拆接线步骤。高压开关柜“五防”闭锁、接地开关、机械/电气联锁不可绕过。"},"faults":[{"phenom":"开关柜出现放电声、异味、局部放电迹象或异常温升","cause":"绝缘老化/受潮；污秽；接触不良；电缆终端应力控制不良；过载或谐波。","action":"立即报告高压值班负责人，按规程安全隔离故障间隔；必要时退出运行并做红外/局放/绝缘等专业检测；不得擅自开柜检查。"},{"phenom":"高压电机差动、接地或过流保护动作","cause":"电机/电缆故障、启动时间异常、CT回路或继电保护问题。","action":"记录保护动作类型、故障录波及运行工况；按批准程序隔离电机和电缆并开展专业试验；禁止未经检查强送电。"}],"predictive":[{"item":"按预防性试验计划做电机、变压器、电缆和开关柜试验。"},{"item":"对保护继电器定期校验，保留整定计算、二次回路和动作试验记录。"}],"sources":[{"name":"IEC 60034-27-4:2018","url":"https://webstore.iec.ch/en/publication/31645"},{"name":"IEEE Std 43标准信息","url":"https://standards.ieee.org/ieee/43/11466/"},{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"}]},{"name":"变频器与电机回路排查要点","params":{"适用范围":"皮带、泵、风机、搅拌机及部分起重/工艺驱动的变频器","检索词":"变频器 VFD 过流 过压 直流母线 通讯 速度反馈 4-20mA","技术依据/来源":"OSHA能量隔离/上锁挂牌参考；Axis网络故障排查"},"principle":{"formula":"变频器输出频率 f 控制同步转速 n_s=120f/P（r/min，P为电机极数）；异步电机实际转速还需扣除转差。VFD输出PWM波形，普通万用表读数可能失真。","desc":"排查先读取故障代码与运行状态：母线欠压/过压、过流、接地、过温、缺相、编码器/通讯等。先确认电机/机械负载、加减速时间、制动单元、冷却和供电质量，不直接提高电流限值。VFD断电后直流母线仍可能有危险电压，隔离和等待放电必须按该驱动器说明书和工作票执行。"},"faults":[{"phenom":"加速时报过流/过载","cause":"加速时间过短；泵/风机/皮带负载异常；机械卡阻；电机参数自学习错误；电缆/电机短路。","action":"读取故障瞬间频率、电流和负载状态；检查机械盘车、负载和电缆；核对电机铭牌参数与控制模式，调整只能按厂家和工艺批准范围。"},{"phenom":"减速时报直流母线过压","cause":"负载惯量大、减速时间过短；再生能量过大；制动电阻/单元故障。","action":"检查减速曲线、负载惯量及制动单元状态；按驱动器制造商计算制动电阻，不使用任意电阻替换。"},{"phenom":"通讯丢失或速度反馈异常","cause":"工业以太网/现场总线断线；屏蔽接地不规范；地址/波特率配置错误；编码器供电/接线问题。","action":"检查交换机端口、总线诊断、屏蔽和接地方案；核对设备地址、参数版本及编码器供电；维护前执行停送电隔离。"}],"predictive":[{"item":"备份VFD参数、PLC程序和版本；记录电机铭牌数据及调试参数。"},{"item":"定期清洁散热通道、检查风扇/滤网、端子紧固和柜内温湿度。"}],"sources":[{"name":"OSHA能量隔离/上锁挂牌参考","url":"https://www.osha.gov/etools/lockout-tagout/hot-topics/energy-control-program/energy-control-circuitry-prohibition"},{"name":"Axis网络故障排查","url":"https://help.axis.com/en-us/troubleshooting-network"}]}]},"network":{"title":"网络、摄像头与传感器排查","devices":[{"name":"工业网络与摄像头离线故障排查","params":{"适用范围":"选矿厂摄像头、NVR、工业交换机、PLC/仪表通信网","检索词":"摄像头 离线 监控 NVR RTSP PoE 交换机 VLAN 丢包 带宽 网络","技术依据/来源":"Axis网络故障排查；塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）"},"principle":{"formula":"网络摄像机带宽预算≈单路平均码率(Mbit/s)×并发路数；再加管理/突发余量。总带宽必须按实际分辨率、帧率、编码、场景动态和录像方式测算，不能只按“每台固定几兆”定容量。","desc":"按层次排查：①供电（PoE交换机每端口功率和整机PoE预算、独立电源）；②物理链路（链路灯、网线/光纤、端口错误包）；③IP层（地址冲突、网段、网关、VLAN）；④应用层（摄像机服务、NVR/RTSP、账户权限、时间同步、存储）；⑤网络容量（上联带宽、交换机背板、丢包/拥塞）。摄像机视频业务宜与生产控制/安全控制网络分区，未经批准不要把摄像机接入PLC控制网。Axis资料建议控制网络跳数、关注吞吐并按实际码率规划。"},"faults":[{"phenom":"摄像头离线、网页无法访问或NVR显示无信号","cause":"摄像机IP/网段变更；NVR通道/凭据错误；RTSP/ONVIF服务未启用或权限改变；VLAN/ACL阻断。","action":"在授权网络管理范围内检查IP连通性、通道状态和服务日志；核对NVR地址、账号权限、VLAN/ACL及时间同步；不要公开或复用默认口令。"},{"phenom":"视频卡顿、花屏、延迟或录像丢帧","cause":"上联带宽不足；交换机拥塞/错误包；无线链路干扰；码率过高；网线/光纤接头问题；PoE供电不稳。","action":"查看交换机端口速率、错误包、丢包和PoE功率；检查线缆/光模块；测算全部摄像头峰值聚合码率；必要时分VLAN/提升上联带宽并优先有线链路。"},{"phenom":"摄像头反复重启或夜间掉线","cause":"PoE功率预算不足；网线压降/接头腐蚀；环境温度或防护不适配；电源浪涌。","action":"核对摄像机最大功耗与交换机每端口/整机PoE预算；检查电缆长度/压接和供电质量；评估温度、防雷和接地。"},{"phenom":"井下摄像头安装合规性不确定","cause":"设备缺少对应爆炸危险区/矿用认证；防爆外壳、接头和供电不匹配。","action":"先由矿山安全/机电负责人确认危险区域等级和认证要求；不能以IP67/IP68替代防爆认证；不满足认证的普通网络摄像机不得安装到相应危险区域。"}],"predictive":[{"item":"绘制交换机—摄像机—NVR链路图，给每个端口贴标签并登记IP/VLAN/PoE需求。"},{"item":"为监控、办公和PLC/控制网络制定隔离策略；定期备份交换机和摄像机配置。"},{"item":"核查录像存储、时间同步、账号密码、固件和日志；重要摄像点考虑备用链路与浪涌保护。"}],"sources":[{"name":"Axis网络故障排查","url":"https://help.axis.com/en-us/troubleshooting-network"},{"name":"塔吉克斯坦矿山安全规则公开查询入口（适用范围需核对）","url":"https://nazorat.tj/?p=6265"}]},{"name":"PLC、传感器与4–20mA信号排查","params":{"适用范围":"流量、压力、液位、温度、振动、浓度和定位传感器","检索词":"PLC 4-20mA 传感器 液位 压力 流量 温度 信号跳动","技术依据/来源":"Axis网络故障排查"},"principle":{"formula":"4–20mA回路常见线性换算：工程量 X = X_min + (I−4mA)/16mA × (X_max−X_min)。0–10V、脉冲、RTD、热电偶和数字总线不可用此式。","desc":"先确认仪表类型、量程、两线/三线/四线接线、供电和PLC输入卡类型。4mA常代表量程零点、20mA代表满量程，但具体故障电流（如低于3.6mA/高于21mA）需按仪表和控制系统配置核对，不应当作所有系统通用的失效判据。"},"faults":[{"phenom":"PLC显示值固定为0、满量程或超量程","cause":"回路断线/短路；24VDC供电丢失；仪表量程设置错误；模拟量模块通道/端子故障。","action":"查看AI模块诊断和回路电流；检查端子、屏蔽、供电和量程设置；用合适的回路校验仪分段验证。"},{"phenom":"测量值跳动、随电机启动而波动","cause":"屏蔽/接地不当；信号电缆与动力电缆并行；接地环路；变频器EMI；端子松动。","action":"检查电缆敷设间距、屏蔽端接和等电位方案；检查端子和隔离器；在批准下做分段对比，不擅自改变安全相关联锁。"},{"phenom":"传感器输出正常但PLC数据异常","cause":"AI量程/通道配置错误；工程单位缩放错误；模块故障；PLC程序或通讯映射变更。","action":"对照电气图、I/O清单、量程和程序版本；使用校验源确认模块；变更需审批、备份和回归测试。"}],"predictive":[{"item":"关键测点建立校准周期和“现场值—PLC值—报警值”比对记录。"},{"item":"模拟量屏蔽、接地和端子标识按统一图纸标准执行；程序修改前备份和审批。"}],"sources":[{"name":"Axis网络故障排查","url":"https://help.axis.com/en-us/troubleshooting-network"}]}]}}}};

// 库存录入栏目为独立页面；库存记录默认保存在本浏览器，部署到共享服务器后自动切换为服务端SQLite共享数据。
db.stockUpload = {title:"库存配件录入 / 上传", cats:{manage:{title:"库存录入与上传",devices:[]}}};
const INVENTORY_LOCAL_KEY = "palut_mine_inventory_v3";
let inventoryItems = {};
let inventoryTransactions = [];
let inventorySyncMode = (location.protocol !== 'file:');
let inventorySyncState = inventorySyncMode ? 'connecting' : 'local';
let inventoryLastServerSync = null;
let inventoryPolling = false;

function splitRecommendedParts(text){
  return String(text||'').split(/[、，,；;\n]+/).map(x=>x.trim()).filter(Boolean);
}
const PART_CATALOG = [];
function buildPartCatalog(){
  PART_CATALOG.length=0;
  Object.entries(db.parts.cats).forEach(([catKey,cat])=>{
    (cat.devices||[]).forEach(bundle=>{
      const p=bundle.params||{};
      splitRecommendedParts(p['常用备件建议']).forEach((partName,idx)=>{
        PART_CATALOG.push({
          catalogId:encodeURIComponent(catKey+'|'+bundle.name+'|'+partName),
          categoryKey:catKey, categoryName:cat.title,
          bundleId:catKey+'|'+bundle.name, bundleName:bundle.name,
          applicability:p['适用设备']||'', partName,
          priority:p['储备级别']||'待评估', verification:p['订货与互换核对']||''
        });
      });
    });
  });
}
buildPartCatalog();
db.parts.cats.custom={title:'自定义库存配件',devices:[]};

function readLocalInventory(){
  try{
    const v=JSON.parse(localStorage.getItem(INVENTORY_LOCAL_KEY)||'{}');
    inventoryItems=v.items||{}; inventoryTransactions=v.transactions||[];

async function refreshInventoryFromServer(silent=false){
  if(!inventorySyncMode) return false;
  if(inventoryPolling){
    for(let i=0;i<30&&inventoryPolling;i++) await new Promise(resolve=>setTimeout(resolve,100));
    return inventorySyncState==='online';
  }
  inventoryPolling=true;
  try{
    const r=await fetch('/api/inventory',{cache:'no-store'});
    if(!r.ok) throw new Error('服务器返回 '+r.status);
    const data=await r.json();
    const beforeSnapshot=JSON.stringify([inventoryItems,inventoryTransactions]);
    inventoryItems={}; (data.items||[]).forEach(x=>{inventoryItems[x.item_key]=x;});
    inventoryTransactions=data.transactions||[];
    const changed=beforeSnapshot!==JSON.stringify([inventoryItems,inventoryTransactions]);
    inventorySyncState='online'; inventoryLastServerSync=new Date();
    if(curFac==='home' && changed){ document.getElementById('content').innerHTML=renderHomePage(); }
    if(curFac==='parts' && changed){
      const oldFilter=document.getElementById('partsDetailFilter')?.value||'';
      renderCon();
      const filter=document.getElementById('partsDetailFilter');if(filter){filter.value=oldFilter;filterPartsInventory();}
    }
    else if(curFac==='stockUpload'){ updateStockUploadLiveData(); updateSyncBanner(); }
    return true;
  }catch(e){
    inventorySyncState='offline';
    if(!silent && curFac==='stockUpload') showInventoryMessage('服务器同步失败：'+e.message+'。当前没有把本次操作当作共享成功。请检查是否通过共享服务器地址打开页面。','error');
    return false;
  }finally{inventoryPolling=false;}
}

function normalizeInventoryItem(item){

function stockStatus(record){

  const min=record.min_stock;
  if(min!==null && min!==undefined && min!=='' && Number(record.quantity)<=Number(min)) return {label:'低于/达到最低库存',cls:'low'};
  return {label:'已登记',cls:'ok'};

function formatQty(v){return (v===null||v===undefined||v==='')?'未盘点':String(v);}
async function commitInventoryTransaction(payload){
  const item=normalizeInventoryItem(payload.item||{});
  const action=payload.action;
  const amount=Number(payload.quantity);
  if(!item.factory_name||!item.workshop_name||!item.equipment_name||!item.part_name) throw new Error('厂区、车间、设备和配件名称必须完整。');
  if(!['期初盘点','盘点','入库','出库'].includes(action)) throw new Error('请选择有效的库存操作类型。');
  if(!Number.isFinite(amount)||amount<0) throw new Error('数量必须为大于或等于0的数字。');
  if(inventorySyncMode){
    if(inventorySyncState!=='online'){
      const ok=await refreshInventoryFromServer(true);
      if(!ok) throw new Error('共享服务器未连接，当前操作未提交。请检查服务器连接后重试。');
    }
    const r=await fetch('/api/transactions',{method:'POST',headers:inventoryApiHeaders(),body:JSON.stringify({...payload,item})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||('服务器保存失败 '+r.status));
    if(!payload.skipRefresh) await refreshInventoryFromServer(true);
  }else{
    const key=item.item_key;
    const old=inventoryItems[key]||null;
    const before=old?old.quantity:null;
    let after=before;
    if(action==='期初盘点'||action==='盘点') after=amount;
    else if(action==='入库'){
      if(before===null||before===undefined) throw new Error('该配件还未建立期初库存，请先选择“期初盘点”。');
      after=Number(before)+amount;
    }else{
      if(before===null||before===undefined) throw new Error('该配件还未建立期初库存，请先盘点后再出库。');
      if(amount>Number(before)) throw new Error('出库数量大于当前库存，已阻止负库存。');
      after=Number(before)-amount;
    }
    const now=new Date().toISOString();
    inventoryItems[key]={...old,...item,item_key:key,quantity:after,min_stock:(payload.minStock===''||payload.minStock===null||payload.minStock===undefined?(old?old.min_stock:null):Number(payload.minStock)),updated_at:now,updated_by:payload.operator||''};
    inventoryTransactions.unshift({item_key:key,action,quantity:amount,before_qty:before,after_qty:after,operator:payload.operator||'',batch:payload.batch||'',supplier:payload.supplier||'',note:payload.note||'',created_at:now,part_name:item.part_name,equipment_name:item.equipment_name,factory_name:item.factory_name,workshop_name:item.workshop_name});
    inventoryTransactions=inventoryTransactions.slice(0,1000);
    saveLocalInventory();
  }
}

    [/颚式破碎机|颚破|jaw/i,/颚式|颚破|jaw|c100|pe\d/i],

    [/反击式破碎机|反击破/i,/反击|impact|pf\d/i],
    [/球磨机|磨机|mqy/i,/球磨|mqy|磨机/i],
    [/旋流器|水力旋流/i,/旋流|fx\d/i],
    [/渣浆泵|浆液泵/i,/渣浆|浆液|zj|wx|slurry/i],
    [/液下泵|立式泵/i,/液下|立式泵|vc|cdl/i],
    [/多级离心泵|离心泵/i,/多级|离心泵|md\d|200d/i],
    [/浮选机/i,/浮选|xcf|kyf/i],
    [/尼尔森|重选机/i,/尼尔森|kc-/i],
    [/振动筛|筛分设备/i,/振动筛|筛分|zkr|2yzs|gd[z]?s|jsl/i],
    [/给料机|给料设备/i,/给料|棒条|圆盘/i],
    [/皮带机|带式输送机|输送机/i,/皮带|带式输送|dt[ii]/i],
    [/浓缩机|浓密机/i,/浓缩机|浓密|nxz|gnz/i],
    [/压滤机/i,/压滤|滤板|xmz/i],
    [/搅拌槽|加药装置|计量泵/i,/药剂|搅拌槽|自动加药/i],
    [/除尘器|布袋除尘/i,/除尘|滤袋|ppc/i],
    [/空压机|压缩机/i,/空压机|sa\d/i],
    [/通风机|风机|鼓风机|热风机/i,/通风机|风机|鼓风机|热风/i],
    [/起重机|桥式|单梁/i,/起重机|桥式|单梁/i],
    [/钻机|升降平台/i,/钻机|液压钻|升降平台/i],
    [/电机|mcc|变频器|电控/i,/电机|mcc|vfd|电控/i]
  ];
  return rules.some(([eqRe,pkgRe])=>eqRe.test(txt)&&pkgRe.test(pkg.bundleName+' '+pkg.applicability));
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}
    else if(c==='"'){quoted=!quoted;}
    else if(c===','&&!quoted){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);
  if(!rows.length)return [];
  const headers=rows.shift().map(x=>x.trim().replace(/^\uFEFF/,''));
  return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
}
function rowValue(row,names){for(const name of names){if(row[name]!==undefined&&row[name]!=='')return row[name];}return '';}
function mapImportRow(row){
  const facText=rowValue(row,['厂区','factory','factoryName']);
  const factoryKey=/采矿/.test(facText)?'cai':(/选矿/.test(facText)?'xuan':facText);
  const factory=db[factoryKey];if(!factory||!['xuan','cai'].includes(factoryKey))throw new Error('厂区无法识别：'+facText);
  const shopText=rowValue(row,['车间','区域','workshop','workshopName']);
  let workshopKey=Object.keys(factory.cats).find(k=>k===shopText||factory.cats[k].title===shopText);
  if(!workshopKey)throw new Error('车间/区域无法识别：'+shopText);
  const eqName=rowValue(row,['设备名称','设备','equipment','equipmentName']);
  const eq=getEquipmentRecords(factoryKey,workshopKey).find(x=>x.equipmentName===eqName);
  if(!eq)throw new Error('设备无法识别：'+eqName);
  const partName=rowValue(row,['配件名称','配件','partName']);if(!partName)throw new Error('配件名称不能为空');
  const catalog=getMatchingCatalog(eq).find(x=>x.partName===partName || x.partName.includes(partName) || partName.includes(x.partName));
  const actionText=rowValue(row,['操作类型','业务类型','action'])||'期初盘点';
  let action=actionText;
  if(/入库/.test(actionText))action='入库';else if(/出库|领用/.test(actionText))action='出库';else if(/盘点|期初/.test(actionText))action=/期初/.test(actionText)?'期初盘点':'盘点';
  const quantityText=rowValue(row,['数量','本次数量','quantity']);
  const quantity=Number(quantityText);if(!Number.isFinite(quantity)||quantity<0)throw new Error('数量无效：'+quantityText);
  const item=normalizeInventoryItem({factoryKey,factoryName:factory.title,workshopKey,workshopName:factory.cats[workshopKey].title,equipmentName:eqName,bundleId:catalog?.bundleId||('custom|'+eqName),bundleName:catalog?.bundleName||'自定义配件',partName,partCode:rowValue(row,['配件编码','原厂料号','partCode']),unit:rowValue(row,['单位','unit'])||'件',location:rowValue(row,['库位','存放位置','location'])});
  return {item,action,quantity,minStock:rowValue(row,['最低库存','minStock']),operator:rowValue(row,['操作人','经办人','operator']),batch:rowValue(row,['批次/供应商','批次','supplier']),note:rowValue(row,['备注','note'])};
}
async function uploadInventoryFile(){
  const file=document.getElementById('inventoryFile')?.files?.[0];if(!file){showInventoryMessage('请先选择CSV、JSON或XLSX文件。','error');return;}
  try{
    const ext=file.name.toLowerCase().split('.').pop();let rows=[];
    if(ext==='xlsx'){
      if(!inventorySyncMode||inventorySyncState!=='online')throw new Error('XLSX导入需要连接共享服务器。离线演示模式请先把Excel另存为CSV UTF-8。');
      const buf=await file.arrayBuffer();let binary='';const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
      const r=await fetch('/api/read-xlsx',{method:'POST',headers:inventoryApiHeaders(),body:JSON.stringify({filename:file.name,contentBase64:btoa(binary)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Excel解析失败');rows=data.rows||[];
    }else if(ext==='json'){
      const raw=JSON.parse(await file.text());if(raw&&Array.isArray(raw.items)&&Array.isArray(raw.transactions)){if(!inventorySyncMode||inventorySyncState!=='online')throw new Error('库存备份恢复需要连接云端服务器。');const resp=await fetch('/api/import-backup',{method:'POST',headers:inventoryApiHeaders(),body:JSON.stringify({backup:raw})});const result=await resp.json();if(!resp.ok)throw new Error(result.error||'备份恢复失败');await refreshInventoryFromServer(true);renderStockUploadPageIntoContent();showInventoryMessage('库存备份恢复成功：'+result.itemsImported+' 条库存档案，'+result.transactionsImported+' 条流水。','success');return;}rows=Array.isArray(raw)?raw:(raw.rows||[]);
    }else if(ext==='csv'){
      let txt=await file.text();if(txt.includes('�')){try{txt=new TextDecoder('gb18030').decode(await file.arrayBuffer());}catch(e){}}
      rows=parseCSV(txt);
    }else throw new Error('目前支持 CSV、JSON、XLSX 文件。');
    if(!rows.length)throw new Error('文件中没有可导入的数据行。');
    let ok=0,failed=[];
    for(let i=0;i<rows.length;i++){
      try{const payload=mapImportRow(rows[i]);if(!payload.operator)throw new Error('缺少操作人');await commitInventoryTransaction({...payload,skipRefresh:true});ok++;}
      catch(e){failed.push('第'+(i+2)+'行：'+e.message);}
    }
    if(inventorySyncMode)await refreshInventoryFromServer(true);
    renderStockUploadPageIntoContent();
    showInventoryMessage('导入完成：成功 '+ok+' 行，失败 '+failed.length+' 行。'+(failed.length?'\n'+failed.slice(0,20).join('\n')+(failed.length>20?'\n其余错误略。':'') :''),failed.length?'error':'success');
  }catch(e){showInventoryMessage('导入失败：'+e.message,'error');}
}

function collectDeviceContext(question){const q=String(question||'').toLowerCase(),matches=[];for(const fk of ['xuan','cai']){const fac=db[fk];for(const [ck,cat] of Object.entries(fac.cats||{})){for(const d of (cat.devices||[])){const text=[d.name,JSON.stringify(d.params||{}),d.principle?.desc,...(d.faults||[]).flatMap(x=>[x.phenom,x.cause,x.action])].join(' ').toLowerCase();const compact=q.replace(/[\s，。；、,!?！？:：]+/g,'');const tokens=q.split(/[\s，。；、,!?！？:：]+/).filter(x=>x.length>1);for(let z=0;z<compact.length-1;z++){const pair=compact.slice(z,z+2);if(/[\u4e00-\u9fff]/.test(pair))tokens.push(pair);}if(text.includes(q)||tokens.some(t=>text.includes(t))){matches.push({factory:fac.title,workshop:cat.title,name:d.name,params:d.params,principle:d.principle,faults:(d.faults||[]).slice(0,8),predictive:(d.predictive||[]).slice(0,6)});}}}}return matches.slice(0,5);}

function containsText(value, kw){
  return String(value==null?'':value).toLocaleLowerCase().includes(String(kw||'').toLocaleLowerCase());
}
function allSearchableText(device){
  const vals=[device.name, device.principle?.formula, device.principle?.desc];
  Object.entries(device.params||{}).forEach(([k,v])=>{vals.push(k,v);});
  (device.faults||[]).forEach(f=>{vals.push(f.phenom,f.cause,f.action);});
  (device.predictive||[]).forEach(p=>{vals.push(p.item,p.content);});
  (device.sources||[]).forEach(x=>{vals.push(x.name,x.url);});
  return vals.join(' | ');
}

          (device.faults||[]).forEach(f=>{if([f.phenom,f.cause,f.action].some(x=>containsText(x,kw))) block+=`【命中故障】${f.phenom||''}\n原因：${f.cause||''}\n处理：${f.action||''}\n`;});
          (device.predictive||[]).forEach(p=>{if(containsText(p.item,kw)||containsText(p.content,kw)) block+=`【命中维护】${p.item||''} ${p.content||''}\n`;});
        }
        if(device.sources?.length) block+=`【参考资料】${device.sources.map(x=>x.name+' '+x.url).join('；')}\n`;
        results.push(block);
      });
    }
  }
  Object.values(inventoryItems).forEach(item=>{
    const hay=[item.factory_name,item.workshop_name,item.equipment_name,item.bundle_name,item.part_name,item.part_code,item.location,item.updated_by].join(' ');
    if(containsText(hay,kw)) results.push(`═══════════════════════════════\n【栏目】实际库存台账\n【位置】${item.factory_name} > ${item.workshop_name}\n【设备】${item.equipment_name}\n【配件】${item.part_name}\n【配件编码】${item.part_code||'未填写'}\n【当前库存】${formatQty(item.quantity)} ${item.unit||'件'}\n【最低库存】${formatQty(item.min_stock)}\n【库位】${item.location||'未填写'}\n【最近更新】${item.updated_at||'—'}（${item.updated_by||'未填操作人'}）`);
  });
  target.innerText=results.length?results.join('\n\n'):'未找到匹配内容。可尝试型号简称、设备部件、故障现象、库位或同义关键词。';
}
function doAi(){
  const input=document.getElementById('akw');
  const target=document.getElementById('ares');
  const kw=(input?.value||'').trim();
  if(!kw){if(target) target.innerText='请输入故障现象或异常关键词';return;}
  const results=[];
  for(const facKey in db){
    const factory=db[facKey];
    for(const catKey in factory.cats){
      const workshop=factory.cats[catKey];
      (workshop.devices||[]).forEach(device=>{
        const hits=(device.faults||[]).filter(f=>[f.phenom,f.cause,f.action].some(x=>containsText(x,kw)));
        if(!hits.length) return;
        let block=`───────────────────────────\n【名称】${device.name}\n【位置】${factory.title} > ${workshop.title}\n`;
        hits.forEach((f,i)=>{block+=`\n异常${i+1}：${f.phenom||''}\n可能原因：${f.cause||''}\n处理建议：${f.action||''}\n`;});
        results.push(block);
      });
    }
  }
  target.innerText=results.length?results.join('\n'):'未匹配到该故障。可换用“振动、温升、过流、绝缘、漏电、接地、离线、压差、堵塞”等关键词。';
}

document.querySelectorAll(".main-item").forEach(i=>{
  i.onclick = ()=>{
    document.querySelectorAll(".main-item").forEach(x=>x.classList.remove("active"));
    i.classList.add("active"); curFac=i.dataset.fac;
    curCat=Object.keys(db[curFac]?.cats||{})[0]||'';
    updateBread();renderSub();renderCon();closeSide();
  };
});

readLocalInventory();
updateHeaderClock();setInterval(updateHeaderClock,30000);
updateBread();
renderSub();
renderCon();
if(inventorySyncMode){
  refreshInventoryFromServer(true);
  setInterval(()=>{refreshInventoryFromServer(true).then(()=>updateSyncBanner());},5000);
}

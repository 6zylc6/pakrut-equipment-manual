<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帕鲁特金矿矿区设备参数与故障手册</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f4f6f8;
    color: #333;
    min-height: 100vh;
  }

  /* 顶部标题 */
  header {
    background: linear-gradient(135deg, #2c3e50, #455a64);
    color: #fff;
    padding: 18px 24px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  header h1 { font-size: 22px; letter-spacing: 1px; }

  /* 主体 */
  .container {
    display: flex;
    min-height: calc(100vh - 64px);
  }

  /* 左侧菜单 */
  nav {
    width: 200px;
    background: #37474f;
    color: #cfd8dc;
    flex-shrink: 0;
  }
  nav .menu-item {
    padding: 16px 20px;
    cursor: pointer;
    border-bottom: 1px solid #455a64;
    transition: background .2s;
  }
  nav .menu-item:hover,
  nav .menu-item.active {
    background: #546e7a;
    color: #fff;
  }

  /* 右侧内容 */
  main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }

  .category-title {
    font-size: 18px;
    color: #37474f;
    margin-bottom: 16px;
    padding-left: 8px;
    border-left: 4px solid #546e7a;
  }

  /* 设备卡片 */
  .device-card {
    background: #fff;
    border-radius: 6px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .device-header {
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #eceff1;
    font-weight: bold;
    color: #263238;
  }
  .device-header:hover { background: #e0e6e9; }
  .device-header .arrow { transition: transform .2s; }
  .device-header.open .arrow { transform: rotate(90deg); }

  /* 参数表 */
  .device-body { display: none; padding: 14px 18px; }
  .device-body.open { display: block; }
  .param-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .param-table th, .param-table td {
    border: 1px solid #cfd8dc;
    padding: 8px 10px;
    text-align: left;
  }
  .param-table th {
    background: #f5f7f8;
    width: 140px;
    color: #455a64;
  }

  /* 故障折叠 */
  .fault-toggle {
    display: inline-block;
    margin: 6px 0 10px;
    padding: 6px 14px;
    background: #546e7a;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .fault-toggle:hover { background: #455a64; }
  .fault-list { display: none; margin-top: 8px; }
  .fault-list.open { display: block; }
  .fault-item {
    border: 1px solid #e0e0e0;
    border-left: 3px solid #f57c00;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fffaf3;
    font-size: 14px;
  }
  .fault-item strong { color: #e65100; }

  /* 手机适配 */
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    nav { width: 100%; display: flex; overflow-x: auto; }
    nav .menu-item { flex: 1; text-align: center; white-space: nowrap; border-bottom: none; border-right: 1px solid #455a64; }
  }
</style>
</head>
<body>

<header>
  <h1>帕鲁特金矿矿区设备参数与故障手册</h1>
</header>

<div class="container">

  <!-- 左侧菜单 -->
  <nav>
    <div class="menu-item active" data-cat="crush">破碎设备</div>
    <div class="menu-item" data-cat="grind">磨矿设备</div>
    <div class="menu-item" data-cat="power">供电设备</div>
    <div class="menu-item" data-cat="drain">排水设备</div>
  </nav>

  <!-- 右侧内容 -->
  <main id="content"></main>

</div>

<script>
/* ========== 数据库内容（直接在这里增删改） ========== */
const db = {
  crush: {
    title: "破碎设备",
    devices: [
      {
        name: "颚式破碎机 PE600×900",
        params: {
          "设备编号": "CR-001",
          "额定功率": "75 kW",
          "额定电压": "380 V",
          "额定电流": "142 A",
          "电机转速": "740 r/min",
          "投运日期": "2023-05-12"
        },
        faults: [
          { phenom: "主机突然停机", cause: "排料口堵塞或皮带打滑", action: "清除堵塞物，检查皮带张紧度" },
          { phenom: "破碎声音异常", cause: "齿板松动或进入铁件", action: "停机检查齿板螺栓，取出异物" },
          { phenom: "电流偏高", cause: "给料过多或轴承损坏", action: "减少给料，测量轴承温度并更换" }
        ]
      },
      {
        name: "圆锥破碎机 H6800",
        params: {
          "设备编号": "CR-002",
          "额定功率": "315 kW",
          "额定电压": "6000 V",
          "额定电流": "38 A",
          "电机转速": "1480 r/min",
          "投运日期": "2022-11-03"
        },
        faults: [
          { phenom: "油温过高报警", cause: "冷却器堵塞或油位低", action: "清洗冷却器，补充润滑油" },
          { phenom: "剧烈振动", cause: "轧臼壁磨损或给料偏析", action: "检查衬板，调整给料分布" }
        ]
      }
    ]
  },
  grind: {
    title: "磨矿设备",
    devices: [
      {
        name: "球磨机 MQY3660",
        params: {
          "设备编号": "GR-001",
          "额定功率": "1250 kW",
          "额定电压": "6000 V",
          "额定电流": "145 A",
          "电机转速": "200 r/min",
          "投运日期": "2021-08-20"
        },
        faults: [
          { phenom: "电机电流波动大", cause: "钢球级配不合理或涨肚", action: "调整钢球配比，减少给矿量" },
          { phenom: "大齿圈异响", cause: "齿轮磨损或润滑不良", action: "检查齿面，补充润滑脂" },
          { phenom: "轴承温度高", cause: "冷却水不足或油质差", action: "检查水路，更换润滑油" }
        ]
      }
    ]
  },
  power: {
    title: "供电设备",
    devices: [
      {
        name: "矿用隔爆干式变压器 KBSG-800",
        params: {
          "设备编号": "PW-001",
          "额定容量": "800 kVA",
          "高压侧": "6 kV",
          "低压侧": "400 V",
          "额定电流": "1155 A",
          "投运日期": "2022-03-15"
        },
        faults: [
          { phenom: "温控仪报警", cause: "绕组超温或传感器故障", action: "检查负载电流，校验传感器" },
          { phenom: "低压侧三相不平衡", cause: "单相负载过大或接线松动", action: "调整负荷，紧固接线端子" }
        ]
      }
    ]
  },
  drain: {
    title: "排水设备",
    devices: [
      {
        name: "多级离心泵 D450-60×8",
        params: {
          "设备编号": "DR-001",
          "额定功率": "900 kW",
          "额定电压": "6000 V",
          "额定电流": "108 A",
          "流量": "450 m³/h",
          "扬程": "480 m",
          "投运日期": "2023-01-10"
        },
        faults: [
          { phenom: "启动后不出水", cause: "泵内未灌满水或有漏气", action: "重新灌泵，检查吸水管密封" },
          { phenom: "电机过载跳闸", cause: "叶轮卡阻或轴承损坏", action: "盘车检查，解体清理叶轮" },
          { phenom: "振动大噪音高", cause: "联轴器不对中或地脚松动", action: "重新找正，紧固地脚螺栓" }
        ]
      }
    ]
  }
};

/* ========== 渲染逻辑 ========== */
const content = document.getElementById("content");
const menuItems = document.querySelectorAll(".menu-item");

function render(catKey) {
  const cat = db[catKey];
  let html = `<div class="category-title">${cat.title}</div>`;
  cat.devices.forEach((dev, idx) => {
    const devId = catKey + idx;
    html += `
      <div class="device-card">
        <div class="device-header" onclick="toggleDevice('${devId}')">
          <span>${dev.name}</span>
          <span class="arrow">▶</span>
        </div>
        <div class="device-body" id="body-${devId}">
          <table class="param-table">
            ${Object.entries(dev.params).map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}
          </table>
          <div class="fault-toggle" onclick="toggleFault('fault-${devId}')">常见故障 ▾</div>
          <div class="fault-list" id="fault-${devId}">
            ${dev.faults.map(f => `
              <div class="fault-item">
                <strong>现象：</strong>${f.phenom}<br>
                <strong>原因：</strong>${f.cause}<br>
                <strong>处理：</strong>${f.action}
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  });
  content.innerHTML = html;
}

function toggleDevice(id) {
  const body = document.getElementById("body-" + id);
  const header = body.previousElementSibling;
  body.classList.toggle("open");
  header.classList.toggle("open");
}

function toggleFault(id) {
  document.getElementById(id).classList.toggle("open");
}

menuItems.forEach(item => {
  item.addEventListener("click", () => {
    menuItems.forEach(i => i.classList.remove("active"));
    item.classList.add("active");
    render(item.dataset.cat);
  });
});

/* 默认显示第一个分类 */
render("crush");
</script>

</body>
</html>
